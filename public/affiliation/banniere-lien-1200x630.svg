<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MELETA — La pratique clinique, ça s'entraîne">
  <defs>
    <radialGradient id="glow" cx="88%" cy="4%" r="70%">
      <stop offset="0%" stop-color="#0e5a54" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#0e5a54" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="-4%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#a8772a" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#a8772a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#f4f1e9"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo lockup -->
  <g transform="translate(72,60)">
    <rect width="64" height="64" rx="16" fill="#0e5a54"/>
    <g transform="translate(20,16) scale(1)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a3.2 3.2 0 0 0-3.2 3.2 2.7 2.7 0 0 0-2.1 4.3 2.7 2.7 0 0 0 1.6 4.8A2.7 2.7 0 0 0 12 20"/>
      <path d="M12 3a3.2 3.2 0 0 1 3.2 3.2 2.7 2.7 0 0 1 2.1 4.3 2.7 2.7 0 0 1-1.6 4.8A2.7 2.7 0 0 1 12 20"/>
      <path d="M12 3v17"/>
    </g>
    <text x="82" y="42" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#15302c" letter-spacing="0.5">MELETA</text>
  </g>

  <!-- Eyebrow -->
  <text x="72" y="252" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#a8772a">PROGRAMME AMBASSADEUR</text>

  <!-- Headline -->
  <text x="70" y="330" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" fill="#15302c" letter-spacing="-1">La pratique clinique,</text>
  <text x="70" y="410" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" fill="#0e5a54" letter-spacing="-1">ça s'entraîne.</text>

  <!-- Subline -->
  <text x="72" y="470" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="26" fill="#3f514c">Cas réalistes · patient simulé par IA · progression par compétences.</text>

  <!-- CTA -->
  <g transform="translate(72,516)">
    <rect width="440" height="52" rx="26" fill="#0e5a54"/>
    <text x="220" y="34" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Essai gratuit — sans carte bancaire</text>
    <text x="472" y="34" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="21" font-weight="700" fill="#15302c">meleta.app</text>

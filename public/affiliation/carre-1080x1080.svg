<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="MELETA — La pratique clinique, ça s'entraîne">
  <defs>
    <radialGradient id="cg" cx="90%" cy="8%" r="75%">
      <stop offset="0%" stop-color="#0e5a54" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#0e5a54" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cg2" cx="6%" cy="98%" r="60%">
      <stop offset="0%" stop-color="#a8772a" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#a8772a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="#f4f1e9"/>
  <rect width="1080" height="1080" fill="url(#cg)"/>
  <rect width="1080" height="1080" fill="url(#cg2)"/>

  <!-- Logo centré -->
  <g transform="translate(540,150)">
    <g transform="translate(-42,0)">
      <rect width="84" height="84" rx="21" fill="#0e5a54"/>
      <g transform="translate(26,20) scale(1.34)" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a3.2 3.2 0 0 0-3.2 3.2 2.7 2.7 0 0 0-2.1 4.3 2.7 2.7 0 0 0 1.6 4.8A2.7 2.7 0 0 0 12 20"/>
        <path d="M12 3a3.2 3.2 0 0 1 3.2 3.2 2.7 2.7 0 0 1 2.1 4.3 2.7 2.7 0 0 1-1.6 4.8A2.7 2.7 0 0 1 12 20"/>
        <path d="M12 3v17"/>
      </g>
    </g>
    <text x="0" y="140" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#15302c" letter-spacing="1">MELETA</text>
  </g>

  <!-- Eyebrow -->
  <text x="540" y="430" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#a8772a">PROGRAMME AMBASSADEUR</text>

  <!-- Headline -->
  <text x="540" y="530" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#15302c" letter-spacing="-1">La pratique</text>
  <text x="540" y="618" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#15302c" letter-spacing="-1">clinique,</text>
  <text x="540" y="706" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#0e5a54" letter-spacing="-1">ça s'entraîne.</text>

  <!-- Subline -->
  <text x="540" y="790" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="27" fill="#3f514c">Cas réalistes · patient simulé par IA</text>
  <text x="540" y="828" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="27" fill="#3f514c">progression par compétences.</text>

  <!-- CTA -->
  <g transform="translate(300,900)">
    <rect width="480" height="60" rx="30" fill="#0e5a54"/>
    <text x="240" y="39" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Essai gratuit — sans carte bancaire</text>
  </g>
  <text x="540" y="1010" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="26" font-weight="700" fill="#15302c">meleta.app</text>

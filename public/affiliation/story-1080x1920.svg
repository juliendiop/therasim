      <stop offset="0%" stop-color="#0e5a54" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#0e5a54" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg2" cx="10%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#a8772a" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#a8772a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="#f4f1e9"/>
  <rect width="1080" height="1920" fill="url(#sg)"/>
  <rect width="1080" height="1920" fill="url(#sg2)"/>

  <!-- Logo -->
  <g transform="translate(540,300)">
    <g transform="translate(-42,0)">

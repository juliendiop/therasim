    </g>
    <text x="0" y="140" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#15302c" letter-spacing="1">MELETA</text>
  </g>

  <text x="540" y="720" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="6" fill="#a8772a">PROGRAMME AMBASSADEUR</text>

  <text x="540" y="860" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#15302c" letter-spacing="-1">La pratique</text>
  <text x="540" y="965" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#15302c" letter-spacing="-1">clinique,</text>
  <text x="540" y="1070" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#0e5a54" letter-spacing="-1">ça s'entraîne.</text>

  <text x="540" y="1180" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="30" fill="#3f514c">Cas réalistes · patient simulé par IA</text>
  <text x="540" y="1224" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, Arial, sans-serif" font-size="30" fill="#3f514c">progression par compétences.</text>

  <!-- CTA bloc bas -->
  <g transform="translate(210,1560)">
